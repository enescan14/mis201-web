    <main>
        <form class="form">
            <h2 text-align="center">Send a message</h2>
            <label for="name">Full Name</label>
            <br>
            <input type="text" id="name" name="name" cols="30" placeholder="Enter your name" minlength="5" maxlength="50" required>
            <br>    
            <label for="email">E-mail</label>
            <br>
            <input background-color="red" type="email" id="email" name="email" cols="30" placeholder="Enter your e-mail address" required>
            <br>
            <label for="message">Message</label>
            <br>
            <textarea id="message" name="message" placeholder="Enter your message" rows="5" cols="30" required></textarea>
            <br>
            <button type="submit">Send Message</button>
            <br>
