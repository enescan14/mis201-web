<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>12/10/2026 MIS201 Class 2. HTML</title>
</head>

<body>
    <h1>WEEK 4 2. HTML</h1>

    <p><a href="index.html">Click </a>for Week 3 details.</p></a>

    <div style="border:3px groove yellow; text-align: center;" >My Website </div>


    <nav></nav>


        <br>
    <section>
        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email.">
            
            <br>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
            <br>
            <input type="radio" id="male" name="gender" value="I'm male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="I'm female">
            <label for="female">Female</label>
            <br>
            <p>My Hobbies</p>
            <input type="checkbox" id="hobby1" name="hobby" value="Reading">
            <label for="hobby1">Reading</label>
            <input type="checkbox" id="hobby2" name="hobby" value="Writing">
            <label for="hobby2">Writing</label>
            <br>
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" cols="20" placeholder="Enter your message."></textarea>
            <br>
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="cs">Computer Science</option>
                <option value="it" selected>Information Technology</option>
                <option value="se">Software Engineering</option>
            </select>
            <br>
            <input type="submit" value="Click me to send">  
        </form>
    </section>    



</body>
